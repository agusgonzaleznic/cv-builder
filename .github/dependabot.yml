# Weekly updates for the pinned actions in .github/workflows and action.yml. The workflows
# `init` writes live under src/ where Dependabot does not look; lint.yml fails when their pins
# differ from these. The Python locks in requirements/ are regenerated by hand (see their
# headers); Dependabot alerts still cover every package in them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # A new release waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
