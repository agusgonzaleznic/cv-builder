# Weekly updates for the pinned actions in .github/workflows and action.yml. The workflows
# `init` writes live under src/ where Dependabot does not look; lint.yml fails when their pins
# differ from these. The Python lock in requirements/ is regenerated by hand (see its header);
# Dependabot alerts still cover every package in it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
