# Lints the workflows and proves every action pin, on every pull request and push to main, with
# the shared actions-lint.yml. The workflows that `cvcite init` writes are linted too, rendered
# with their placeholder filled in, since they run in every user's repository, and their pins
# must match this repository's (check-template-pins.sh), since Dependabot does not look under src/.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Lint" is half of the main ruleset's required checks ("Lint / actionlint", "Lint / Verify
  # action pins"): renaming it is a breaking change.
  lint:
    name: Lint
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/actions-lint.yml@bd069d1adaece9f8420bf7d4bed5a0cf9288363b # v1.5.0
    with:
      runs-on: ubuntu-24.04
      prepare-command: .github/scripts/render-templates.sh .tmp/rendered/.github/workflows
      actionlint-files: .github/workflows/*.yml .tmp/rendered/.github/workflows/*.yml
      pin-paths: .github/workflows action.yml src/cvcite/templates/repo/github/workflows
      extra-pin-command: .github/scripts/check-template-pins.sh
