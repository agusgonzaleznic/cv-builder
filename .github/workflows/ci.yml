# Tests on every pull request and every push to main, the action itself run end to end on the
# made-up sample, and the package built as a release builds it. Read-only token; nothing is
# published. Actions are pinned to full commit SHAs with the release in a comment; lint.yml
# proves each pin.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ghostscript, the gate's third extractor
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y --no-install-recommends ghostscript

      - name: Install the pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --no-deps --only-binary :all: \
            -r requirements/action.txt -r requirements/test.txt

      - name: Run the tests
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest -q

  action:
    name: Action on the sample
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check, render, gate and package the sample
        uses: ./
        with:
          working-directory: src/cvcite/templates/sample
          package: "true"
          # This repository is public, and the sample person is made up.
          allow-public: "true"

      - name: The release files are there
        working-directory: src/cvcite/templates/sample
        run: |
          set -euo pipefail
          unzip -l .tmp/release/build.zip
          (cd .tmp/release && unzip -q build.zip && sha256sum -c SHA256SUMS)

  package:
    name: Package build
    # The build publish.yml runs, on every change, so a stale requirements/build.txt or a broken
    # build fails a pull request instead of a release (a v* tag can never move).
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/python-build.yml@869d745963f183696bbe2ceed330891c195916ce # v1.4.0
    with:
      build-constraints: requirements/build.txt
