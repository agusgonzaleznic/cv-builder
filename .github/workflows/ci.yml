# Tests on every pull request and every push to main, and the action itself run end to end on
# the made-up sample. Read-only token; nothing is uploaded. Actions are pinned to full commit
# SHAs with the release in a comment; lint.yml proves each pin.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ghostscript, the gate's third extractor
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y --no-install-recommends ghostscript

      - name: Install the pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --no-deps \
            -r requirements/action.txt -r requirements/test.txt

      - name: Run the tests
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest -q

  action:
    name: Action on the sample
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check, render, gate and package the sample
        uses: ./
        with:
          working-directory: src/cvcite/templates/sample
          package: "true"

      - name: The release files are there
        working-directory: src/cvcite/templates/sample
        run: |
          set -euo pipefail
          unzip -l .tmp/release/build.zip
          (cd .tmp/release && unzip -q build.zip && sha256sum -c SHA256SUMS)
