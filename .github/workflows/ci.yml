# Tests on every pull request and every push to main, the action itself run end to end on the
# made-up sample, and the package built as a release builds it. Read-only token; nothing is
# published. The tests and the build run in the shared reusable workflows; everything is pinned
# to full commit SHAs with the release in a comment, and lint.yml proves each pin.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job names here are half of the main ruleset's required checks ("Tests / Python 3.12",
  # "Package build / Build sdist and wheel"; "Action on the sample" whole): renaming one is a
  # breaking change.
  tests:
    name: Tests
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/python-tests.yml@bd069d1adaece9f8420bf7d4bed5a0cf9288363b # v1.5.0
    with:
      runs-on: ubuntu-24.04
      requirements: requirements/action.txt requirements/test.txt
      # Ghostscript is the gate's third extractor.
      apt-packages: ghostscript
      pythonpath: src

  # Stays here, the one exception to the shared workflows: it runs this repository's own action
  # (uses: ./) with cvcite's inputs and checks cvcite's release files, so a shared copy would be
  # cvcite-only, and every new action input would cost a shared release and a pin bump.
  action:
    name: Action on the sample
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check, render, gate and package the sample
        uses: ./
        with:
          working-directory: src/cvcite/templates/sample
          package: "true"
          # This repository is public, and the sample person is made up.
          allow-public: "true"

      - name: The release files are there
        working-directory: src/cvcite/templates/sample
        run: |
          set -euo pipefail
          unzip -l .tmp/release/build.zip
          (cd .tmp/release && unzip -q build.zip && sha256sum -c SHA256SUMS)

  package:
    name: Package build
    # The build publish.yml runs, on every change, so a stale requirements/build.txt or a broken
    # build fails a pull request instead of a release (a v* tag can never move).
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/python-build.yml@bd069d1adaece9f8420bf7d4bed5a0cf9288363b # v1.5.0
    with:
      build-constraints: requirements/build.txt
