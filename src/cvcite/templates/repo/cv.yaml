# The master: every fact of your CV, and the design. It is never sent on its own; each overlay in
# variants/ positions it for one kind of role, and `cvcite build` turns each into a PDF.
#
# Replace every TODO. A fact goes into facts.yaml first, with its source, then here.
# Format: https://docs.rendercv.com (RenderCV 2.8).
cv:
  name: TODO Your Name
  headline: TODO the role you want next
  location: TODO City, Country
  email: TODO@example.com
  # phone: "+44 20 ..."    quoted, with the country code
  # website: https://example.com
  sections:
    summary:
      - "TODO Four to six lines: your level and domain, your strongest scope proof, the pattern you are hired for, the role you want."
    Skills:
      - label: TODO label
        details: TODO one, TODO two
    experience:
      - company: TODO Company
        position: TODO Title
        location: TODO City
        start_date: 2020-01
        end_date: present
        highlights:
          - "TODO One line of scope: who you report to, team size, budget you own."
          - "TODO An outcome with its baseline, timeframe and your part in it."
    education:
      - institution: TODO University
        area: TODO Subject
        degree: TODO BSc
        start_date: 2016
        end_date: 2019

design:
  theme: engineeringresumes
  page:
    size: a4
    show_top_note: false
  header:
    connections:
      # The default prints a national number and drops the country code.
      phone_number_format: international
  typography:
    # The default, "justified", lets Typst hyphenate words across lines, which splits keywords
    # for every parser. The gate fails a PDF with such a split.
    alignment: justified-with-no-hyphenation
  templates:
    # RenderCV's theme puts "--" between the employer and the place, and Typst prints that as
    # an en dash. A plain comma reads the same to people and to parsers.
    experience_entry:
      main_column: "**POSITION**, COMPANY, LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE"
    education_entry:
      main_column: "**INSTITUTION**, DEGREE_WITH_AREA, LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE"
      degree_column: null
