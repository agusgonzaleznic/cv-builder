# The fact ledger: every fact the CV may state, with where it comes from. A fact goes here first,
# then into cv.yaml, never the other way round. `cvcite check` fails any number in a bullet
# that no fact holds, and any number that only a private fact holds.
#
# Each fact:
#   id:          a short name, unique
#   text:        the fact, with its numbers written as they will appear on the CV
#   source:      where it is proven: a document, a link, "confirmed by me on <date>"
#   confirmed:   the date you last checked it (YYYY-MM-DD)
#   visibility:  public   fine on the CV and on public profiles
#                cv-only  fine on the CV you send, kept off public profiles
#                private  never on the CV or any profile
#   terms:       for a private fact, the words that identify it (a customer under NDA, an
#                internal project); `cvcite check` fails a CV that contains any of them
#
# Keep private facts in facts.private.yaml, in the same format: git ignores it, so they are never
# committed, pushed or sent to the AI review, and `cvcite check` still reads them here.
facts: []
